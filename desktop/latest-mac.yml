releaseNotes: >
  ### Highlights

  - Settings no longer reloads itself in a loop after opening: the provider
  spinner and the GitHub CLI check settle, and tabs stop flickering.


  ### Fixes

  - Settings no longer reloads everything on the page in a loop after opening.
  In 0.6.0 the "Verifying installed providers and sign-ins…" spinner never went
  away, the GitHub CLI section stayed on "Detecting…", tabs flickered as every
  setting reloaded several times a second, and the app kept re-running provider
  and GitHub checks in the background for as long as the page was open.
