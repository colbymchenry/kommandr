releaseNotes: >
  ### Highlights

  - The native mobile companion restores unanswered questions when you return to
  a chat or runner.

  - Chat notifications on your phone open the exact conversation that needs your
  attention.


  ### Fixes

  - Questions waiting for a response reappear after the phone reconnects,
  including questions from running tasks.

  - Mobile chat notifications retain the conversation they belong to, so opening
  a notification does not switch to a different thread.
