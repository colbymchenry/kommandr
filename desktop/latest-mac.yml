releaseDate: 2026-09-03T19:28:03.482Z
releaseNotes: >
  ### Highlights

  - Creating a new project is one page again — pick what you're building, the
  framework **and its version**, where it goes, and which tracker its issues
  live in (local, JIRA, Neon…), then Create. New projects come out ready to use
  instead of asking to be initialized.

  - The Planner and the General chat can browse the web in a brand-new project,
  before any dev server is set up — so "go look at this site and rebuild it
  here" works, screenshots and all.


  ### New Features

  - Create New is a single page instead of a three-step wizard: what you're
  building, the framework, its version, a few framework options, name and
  folder, issue key, storage backend, client, and a note for the agent — with a
  one-line summary of exactly what will be created above the Create button.

  - Pick the framework when creating a project. Websites offer Astro, Eleventy
  or plain Vite; web apps Next.js, SvelteKit, Nuxt or React Router; mobile apps
  Expo or the React Native CLI; API backends Hono, Express, Fastify or NestJS;
  Shopify themes Skeleton or Dawn. Astro was previously forced on every website.

  - Pick the framework version from a dropdown listing its release lines from
  the npm registry — 7.x, 6.x, 5.x, Expo's SDK 57, SDK 56…, and pre-release tags
  — with the latest release preselected. The agent pins the version you choose.

  - Choose the storage backend (local SQLite, JIRA, PostgreSQL/Neon…) and the
  client for a new project right in the Create New form, the same choices the
  Add Existing and Clone tabs already offered.

  - Create a General project (documents, files and tasks — no code) from the
  same form: an empty folder with a docs/ directory, ready in a second, no agent
  involved.

  - The Create New form remembers the parent folder you used last time (falling
  back to the folder your most recent project lives in), and lets you pick which
  AI provider and model scaffolds the project.

  - If scaffolding fails after the folder was created, the error screen offers
  to register the folder as it is instead of starting over.

  - The AI browser can save its screenshots into the project (`saveAs` on the
  screenshot tool), so a Planner asked to study a site can keep full-page and
  per-section captures under the repo and point each task at exact reference
  images instead of describing them.


  ### Fixes

  - The Planner and the General chat can use the browser in a project that has
  no dev server set up yet — a fresh project whose reference site lives
  elsewhere, for example. The browser tools only loaded once a dev server was
  configured, so asking the Planner to screenshot a site got "I can't browse the
  web from this planning session" back. The Planner is also told how to use the
  browser now; before, even in a project with a dev server, nothing in its
  briefing mentioned it.

  - A chat no longer stays stuck on "Writing…" with the composer reading "Claude
  Code is responding…" after a reply that asked you two or more questions along
  the way — the response had finished, but the chat only unlocked after pressing
  Stop.

  - A project created from the Create New tab no longer lands on "This project
  hasn't been initialized yet": Kommandr now sets up the issue store (and the
  storage backend you chose) before registering the project, so the board works
  the moment the scaffold finishes.

  - The Create New tab's framework options are decided by Kommandr instead of
  being generated by a model on every visit — the form appears instantly, and
  the same framework always offers the same options.

  - Scaffolding a project with a non-Claude default provider no longer asks it
  for a model it doesn't have.
