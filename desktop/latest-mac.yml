releaseNotes: >
  ### Highlights

  - Fixed the phone getting stuck on a plain, unstyled "Loading projects…"
  screen — remote access could end up fighting itself and drop every request
  after the first.


  ### Fixes

  - Fixed the phone loading a plain, unstyled page stuck on "Loading projects…".
  Restarting remote access could leave the Mac holding two connections at once;
  because only the newest counts, the two knocked each other offline about twice
  a second and nothing after the first page request got through — and it stayed
  that way until the app was restarted. Remote access now keeps a single
  connection, and restarting it replaces that connection cleanly instead of
  leaving the old one fighting the new one.
