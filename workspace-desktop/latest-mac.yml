releaseNotes: >
  ### Highlights

  - Your team, conversations, and bot desktops in a dedicated Mac app.

  - A cleaner title bar with compact controls alongside the native traffic
  lights.

  - A new update window with release notes, download progress, and a restart
  when you’re ready.


  ### Improvements

  - Automatic update checks, with a reminder in your account menu.

  - Full mouse and keyboard control when you open a bot’s desktop.

  - Secure browser sign-in and a reconnect screen when your connection is
  interrupted.

  - Signed and notarized downloads for Apple Silicon and Intel Macs.
